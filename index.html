<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    :root {
      --ink: #17231f;
      --muted: #6b7972;
      --paper: #f5f4ef;
      --panel: #fffdf8;
      --line: #dfe4dc;
      --accent: #d96c43;
      --accent-dark: #af4d2c;
      --mint: #dbe9df;
      --shadow: 0 24px 60px rgba(45, 61, 50, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 15% 10%, #e6efe5 0, transparent 30%), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      animation: page-in .7s ease both;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    nav { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 18px max(16px, calc((100% - 920px) / 2)); background: var(--accent); box-shadow: 0 8px 24px rgba(45, 61, 50, .14); }
    .brand { color: #fffaf2; font: 700 14px Arial, sans-serif; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; }
    .nav-links { display: flex; gap: 22px; }
    .nav-links a { color: #fff1e8; font: 13px Arial, sans-serif; text-decoration: none; transition: color .2s ease, transform .2s ease; }
    .nav-links a:hover { color: #fff; transform: translateY(-2px); }

    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 34px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent-dark); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(42px, 7vw, 76px); line-height: .92; font-weight: 400; letter-spacing: -2px; }
    .date { margin: 0 0 5px; color: var(--muted); font: 14px Arial, sans-serif; text-align: right; }

    .app { display: grid; grid-template-columns: 1.4fr .8fr; gap: 20px; }
    .panel { background: rgba(255, 253, 248, .9); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .tasks-panel { animation: slide-up .65s .12s ease both; }
    .side-panel { animation: slide-up .65s .24s ease both; }
    .tasks-panel { padding: 24px; }
    .side-panel { padding: 24px; align-self: start; }

    form { display: flex; gap: 10px; margin-bottom: 22px; }
    input[type="text"] { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 5px; padding: 14px 15px; color: var(--ink); background: #fff; font: 16px Georgia, serif; }
    input[type="text"]:focus { outline: 3px solid rgba(217, 108, 67, .18); border-color: var(--accent); }
    button { border: 0; border-radius: 5px; cursor: pointer; font: 700 13px Arial, sans-serif; }
    .add-button { padding: 0 20px; color: #fff; background: var(--accent); transition: transform .2s ease, background .2s ease; }
    .add-button:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .add-button:active { transform: translateY(0) scale(.97); }

    .section-heading { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
    .section-heading:first-of-type { margin-top: 0; }
    h2 { margin: 0; font-size: 23px; font-weight: 400; }
    .count { color: var(--muted); font: 12px Arial, sans-serif; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 17px; animation: task-in .4s var(--delay, 0s) ease both; }
    li:last-child { border-bottom: 0; }
    li.done span { color: var(--muted); text-decoration: line-through; }
    li.done { animation: task-in .4s ease both, complete-pulse .5s .1s ease both; }
    .check { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: 0 0 auto; }
    li span { flex: 1; line-height: 1.35; }
    .delete { padding: 5px 7px; color: var(--muted); background: transparent; font-size: 17px; transition: color .2s ease, transform .2s ease; }
    .delete:hover { color: var(--accent-dark); transform: rotate(8deg) scale(1.15); }
    .empty { color: var(--muted); font: 14px Arial, sans-serif; }

    .side-panel h2 { margin-bottom: 20px; }
    .progress-track { height: 10px; overflow: hidden; margin-bottom: 12px; border-radius: 99px; background: var(--mint); }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s cubic-bezier(.22, 1, .36, 1); }
    .progress-copy { display: flex; justify-content: space-between; color: var(--muted); font: 13px Arial, sans-serif; }
    .clear-button { width: 100%; margin-top: 28px; padding: 12px; color: var(--accent-dark); background: #f8e4db; }
    .clear-button:hover { background: #f2d3c7; }

    @keyframes page-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes task-in {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes complete-pulse {
      50% { background: rgba(219, 233, 223, .6); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 680px) {
      main { padding-top: 34px; }
      header { display: block; }
      .date { margin-top: 16px; text-align: left; }
      .app { grid-template-columns: 1fr; }
      .side-panel { order: -1; }
      .tasks-panel, .side-panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
      <a class="brand" href="#top">Todo / 01</a>
      <div class="nav-links">
        <a href="#tasks-title">Today</a>
        <a href="#progress-summary">Progress</a>
      </div>
  </nav>
  <main id="top">
    <header>
      <div>
        <p class="eyebrow">Personal planner</p>
        <h1>Todo list</h1>
      </div>
      <p class="date" id="today"></p>
    </header>

    <div class="app">
      <section class="panel tasks-panel" aria-labelledby="tasks-title">
        <form id="todo-form">
          <label class="sr-only" for="new-task">New task</label>
          <input id="new-task" type="text" placeholder="What needs doing?" autocomplete="off" required>
          <button class="add-button" type="submit">Add task</button>
        </form>
        <div class="section-heading"><h2 id="tasks-title">Tasks</h2><span class="count" id="task-count"></span></div>
        <ul id="task-list"></ul>
      </section>

      <aside class="panel side-panel" id="progress-summary" aria-label="Progress summary">
        <h2>Progress</h2>
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-copy"><span id="progress-text">0 of 0 complete</span><span id="progress-percent">0%</span></div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </aside>
    </div>
  </main>

  <script>
    const storageKey = "personal-todo-list";
    const starterTasks = [
      { text: "Review priorities for the day", done: false },
      { text: "Complete the most important task first", done: false },
      { text: "Block time for focused work", done: false },
      { text: "Check progress before finishing the day", done: false },
      { text: "Define 3 key goals for the week", done: false },
      { text: "Break larger tasks into smaller steps", done: false }
    ];
    let tasks = JSON.parse(localStorage.getItem(storageKey) || "null") || starterTasks;

    const taskList = document.querySelector("#task-list");
    const taskForm = document.querySelector("#todo-form");
    const newTask = document.querySelector("#new-task");
    const taskCount = document.querySelector("#task-count");
    const progressBar = document.querySelector("#progress-bar");
    const progressText = document.querySelector("#progress-text");
    const progressPercent = document.querySelector("#progress-percent");

    document.querySelector("#today").textContent = new Intl.DateTimeFormat("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    }).format(new Date());

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function render() {
      taskList.replaceChildren();
      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = task.done ? "done" : "";
        item.style.setProperty("--delay", `${Math.min(index * 45, 360)}ms`);

        const checkbox = document.createElement("input");
        checkbox.className = "check";
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Mark ${task.text} complete`);
        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          render();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
        deleteButton.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          render();
        });

        item.append(checkbox, label, deleteButton);
        taskList.append(item);
      });

      const completed = tasks.filter(task => task.done).length;
      const percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
      taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
      progressText.textContent = `${completed} of ${tasks.length} complete`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const text = newTask.value.trim();
      if (!text) return;
      tasks.unshift({ text, done: false });
      saveTasks();
      render();
      taskForm.reset();
      newTask.focus();
    });

    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
